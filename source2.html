<script id="translator-core">'use strict';
const InformationTranslator=(()=>{
  const COUNT=0x110000-0x800,MAX_CHARS=20000;
  const enc=new TextEncoder(),FORMAT='INFO-TRANSLATOR-BOOK';
  const fail=text=>{throw new Error(text);};
  const supported=()=>!!globalThis.crypto?.subtle&&!!globalThis.crypto?.getRandomValues;
  function random(size){
    if(!supported())fail('当前环境不支持此工具，请用新版 Safari、Edge、Chrome 或 Firefox 打开');
    const bytes=new Uint8Array(size);
    for(let p=0;p<size;p+=65536)crypto.getRandomValues(bytes.subarray(p,Math.min(size,p+65536)));
    return bytes;
  }
  function concat(...arrays){const out=new Uint8Array(arrays.reduce((n,a)=>n+a.length,0));let p=0;for(const a of arrays){out.set(a,p);p+=a.length;}return out;}
  const hash=async bytes=>new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));
  const hex=bytes=>Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
  function equal(a,b){if(a.length!==b.length)return false;let difference=0;for(let i=0;i<a.length;i++)difference|=a[i]^b[i];return difference===0;}
  function base64(bytes){let out='';for(let p=0;p<bytes.length;p+=8192)out+=String.fromCharCode(...bytes.subarray(p,p+8192));return btoa(out).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function unbase64(text){
    if(typeof text!=='string'||!/^[A-Za-z0-9_-]+$/.test(text)||text.length%4===1)fail('内容编码不完整，请重新复制');
    let bytes;try{bytes=Uint8Array.from(atob(text.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));}catch{fail('内容编码不完整，请重新复制');}
    if(base64(bytes)!==text)fail('内容编码不正确，请重新复制');return bytes;
  }
  // Fixed-width decimal groups preserve leading zeroes and all packet bytes.
  // A v2 envelope always has an odd byte count: two bytes -> five digits,
  // followed by one final byte -> three digits. No visible fixed prefix.
  function decimal(bytes){
    const parts=[];let p=0;
    for(;p+1<bytes.length;p+=2)parts.push(((bytes[p]<<8)|bytes[p+1]).toString().padStart(5,'0'));
    if(p<bytes.length)parts.push(bytes[p].toString().padStart(3,'0'));
    return parts.join('');
  }
  function undecimal(text){
    if(!/^[0-9]+$/.test(text)||text.length%5!==3)fail('数字密文不完整，请重新复制');
    const pairs=(text.length-3)/5,bytes=new Uint8Array(pairs*2+1);
    for(let i=0;i<pairs;i++){
      const value=Number(text.slice(i*5,i*5+5));
      if(value>65535)fail('数字密文格式不正确，请重新复制');
      bytes[i*2]=value>>>8;bytes[i*2+1]=value&255;
    }
    const last=Number(text.slice(-3));if(last>255)fail('数字密文格式不正确，请重新复制');
    bytes[bytes.length-1]=last;return bytes;
  }
  function shortDecimal(bytes){return decimal(bytes)+(bytes.length%2?'1':'0');}
  function unshortDecimal(text){
    const remainder=text.length%5,odd=remainder===4;
    if(!/^[0-9]+$/.test(text)||(!odd&&remainder!==1)||text.at(-1)!==(odd?'1':'0'))fail('数字密文不完整，请重新复制');
    const body=text.slice(0,-1);if(odd)return undecimal(body);
    const bytes=new Uint8Array(body.length/5*2);
    for(let i=0;i<bytes.length/2;i++){const value=Number(body.slice(i*5,i*5+5));if(value>65535)fail('数字密文格式不正确，请重新复制');bytes[i*2]=value>>>8;bytes[i*2+1]=value&255;}
    return bytes;
  }
  function nameOf(name){
    if(typeof name!=='string'||!name.trim()||[...name.trim()].length>40||/[\u0000-\u001F\u007F]/.test(name))fail('请填写 1–40 个字符的密码本名称');
    return name.trim();
  }
  function characters(text){
    if(typeof text!=='string'||!text.length)fail('请先输入要加密的内容');
    if(text.length>MAX_CHARS*2)fail('每条原文最多 20,000 个 Unicode 字符');
    const list=[...text];if(list.length>MAX_CHARS)fail('每条原文最多 20,000 个 Unicode 字符');
    for(const c of list){const n=c.codePointAt(0);if(n>=0xD800&&n<=0xDFFF)fail('原文含有无效字符，请重新粘贴');}return list;
  }
  function scalarIndex(cp){if(!Number.isInteger(cp)||cp<0||cp>0x10FFFF||(cp>=0xD800&&cp<=0xDFFF))fail('无效的 Unicode 字符');return cp>=0xE000?cp-0x800:cp;}

  function canonical(file){return JSON.stringify({format:FORMAT,v:1,name:file.name,id:file.id,seed:file.seed});}

    const file={format:FORMAT,v:1,name:nameOf(name),id:await fingerprint(seed),seed:base64(seed)};
    file.checksum=hex(await hash(enc.encode(canonical(file))));return JSON.stringify(file,null,2);
  }
  async function readFile(raw){
    if(typeof raw!=='string'||raw.length>8192)fail('密码本文件过大或格式不正确，请选择导出的 .itbook 文件');

    if(/^[0-9]+$/.test(compact)&&[1,4].includes(compact.length%5)){
      const packet=unshortDecimal(compact);
      if(packet.length<37||packet.length>52536||packet[12]!==4)fail('无法识别密文，请确认复制完整并使用相同的加密器');
      return {version:4,packet};
    }

</script><script id="translator-app">'use strict';
(()=>{
  const $=id=>document.getElementById(id),API=InformationTranslator,STORAGE_KEY='information-translator.books2';
  let records=[],activeId='',cached=null,busy=false,lastAction='encode',pendingDeleteId='',copyToastTimer=0,savingFile=false,pendingFile=null;
  const active=()=>records.find(record=>record.id===activeId);

  function copied(){clearTimeout(copyToastTimer);$('copy-toast').classList.remove('hidden');copyToastTimer=setTimeout(()=>$('copy-toast').classList.add('hidden'),1000);}
  function dropCache(){cached?.destroy();cached=null;}
  function buttons(){
    for(const id of ['new-book','import-book'])$(id).disabled=busy||!API.supported();
    $('book-select').disabled=busy||!records.length;
    for(const id of ['export-book','rename-book'])$(id).disabled=busy||!active()||(id==='export-book'&&savingFile);
    for(const button of $('book-list').querySelectorAll('button'))button.disabled=busy;
    for(const id of ['copy','download-text','reverse'])$(id).disabled=busy||!$('output').value||(id==='download-text'&&savingFile);
  }

  function count(){$('input-count').textContent=[...$('input').value].length.toLocaleString()+' 字符';}
  function closeBookMenu(focus=false){$('book-list').classList.add('hidden');$('book-select').setAttribute('aria-expanded','false');if(focus)$('book-select').focus();}
  function openBookMenu(focus=false,last=false){
    if(busy||!records.length)return;$('book-list').classList.remove('hidden');$('book-select').setAttribute('aria-expanded','true');
    if(focus){const choices=Array.from($('book-list').querySelectorAll('.book-choice')),current=choices.find(button=>button.dataset.bookId===activeId);(last?choices[choices.length-1]:current||choices[0])?.focus();}
  }
  async function chooseBook(id){
    if(busy)return;closeBookMenu();clearResult();
    await task('正在切换密码本',async()=>{await selectBook(id);status('已选用「'+active().name+'」','success');});
    $('book-select').focus();
  }
  function renderBooks(){
    const list=$('book-list');list.replaceChildren();
    $('book-selected-name').textContent=active()?.name||(records.length?'请选择密码本':'尚未选择密码本');$('book-select').dataset.bookId=activeId;
    for(const record of records){
      const row=document.createElement('div'),choice=document.createElement('button'),remove=document.createElement('button');
      row.className='book-item'+(record.id===activeId?' is-current':'');row.dataset.bookId=record.id;
      choice.type='button';choice.className='book-choice';choice.textContent=record.name;choice.title=record.name;choice.dataset.bookId=record.id;choice.setAttribute('aria-pressed',String(record.id===activeId));choice.onclick=()=>chooseBook(record.id);
      remove.type='button';remove.className='book-remove';remove.textContent='删除';remove.dataset.bookId=record.id;remove.setAttribute('aria-label','删除「'+record.name+'」');remove.onclick=()=>requestDelete(record.id);

  }
  function persist(nextRecords=records){
    try{
      if(nextRecords.length)localStorage.setItem(STORAGE_KEY,JSON.stringify({v:1,files:nextRecords.map(record=>record.raw)}));

  }
  async function task(text,action){

    status(text);

    catch(error){status(error?.message||'操作未完成，请重试','error');}

  }
  async function selectBook(id,save=true){

    activeId=id;$('rename-row').classList.add('hidden');if(save)persist();return cached;
  }
  function download(text,name,type='text/plain;charset=utf-8'){

  }
  function readBookFile(file){

  }

  $('book-list').onkeydown=event=>{

    const choices=Array.from($('book-list').querySelectorAll('.book-choice'));if(!choices.length)return;event.preventDefault();
    const index=choices.findIndex(button=>button.dataset.bookId===event.target.dataset.bookId);
    const next=event.key==='Home'?0:event.key==='End'?choices.length-1:(index+(event.key==='ArrowDown'?1:-1)+choices.length)%choices.length;choices[next].focus();
  };
  document.addEventListener('click',event=>{if(!$('book-picker').contains(event.target))closeBookMenu();});
  $('book-picker').addEventListener('focusout',event=>{if(event.relatedTarget&&!$('book-picker').contains(event.relatedTarget))closeBookMenu();});
  $('import-book').onclick=()=>$('book-file').click();
  $('book-file').onchange=()=>{
    const file=$('book-file').files?.[0];$('book-file').value='';if(!file)return;
    return task('正在导入密码本',async()=>{
      if(file.size>8192)throw new Error('所选文件不是有效的密码本，请选择导出的 .itbook 文件');
      const parsed=await API.Book.readFile(await readBookFile(file)),existing=records.find(item=>item.id===parsed.id);
      if(existing&&existing.seed!==parsed.seed)throw new Error('密码本编号发生冲突，请核对文件');
      if(!existing){if(records.length>=200)throw new Error('当前浏览器已保存较多密码本，请换一个浏览器导入');records.push({id:parsed.id,name:parsed.name,seed:parsed.seed,raw:JSON.stringify(parsed,null,2)});}

    });
  };
  $('export-book').onclick=()=>{
    const record=active();if(!record||busy||savingFile)return;
    const filename=record.name.replace(/[<>:"/\\|?*\u0000-\u001F]/g,'_')+'.itbook';
    return saveFile({text:record.raw,name:filename,type:'application/json',extension:'.itbook',description:'密码本文件',title:'导出密码本',saved:'密码本已保存',origin:'export-book',pickerId:'midianji-codebook'});
  };

  $('cancel-name').onclick=()=>$('rename-row').classList.add('hidden');
  $('book-name').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();$('rename-confirm').click();}if(event.key==='Escape')$('rename-row').classList.add('hidden');};

    const record=active();if(!record)throw new Error('请先选择密码本');
    const raw=await API.Book.renameFile(record.raw,$('book-name').value),file=await API.Book.readFile(raw);record.name=file.name;record.raw=raw;
    $('rename-row').classList.add('hidden');persist();status('已重命名为「'+file.name+'」','success');
  });
  function requestDelete(id){
    const record=records.find(item=>item.id===id);if(busy||!record)return;closeBookMenu();
    pendingDeleteId=record.id;
    $('delete-description').textContent='删除「'+record.name+'」的本机记录？已导出的文件不会删除，如果没有文件备份，删除后将无法恢复这本密码本';

  }
  $('cancel-delete').onclick=()=>$('delete-dialog').close();

    const record=records.find(item=>item.id===pendingDeleteId);if(!record){$('delete-dialog').close();return;}

  $('input').onkeydown=async event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();run(await API.isMessage($('input').value)?'decode':'encode');}};
  $('clear-text').onclick=()=>{$('input').value='';clearResult();count();status('内容已清空');};
  $('reverse').onclick=()=>{if(!$('output').value||busy)return;$('input').value=$('output').value;count();run(lastAction==='encode'?'decode':'encode');};
  $('copy').onclick=async()=>{
    if(!$('output').value)return;
    try{if(!navigator.clipboard?.writeText)throw new Error();await navigator.clipboard.writeText($('output').value);copied();}
    catch{
      $('output').focus();$('output').select();
      if(typeof $('output').setSelectionRange==='function')$('output').setSelectionRange(0,$('output').value.length);
      let success=false;
      try{success=document.execCommand('copy');}catch{}
      if(success)copied();else status('结果已选中，请使用系统复制');
    }
  };
  function saveFilename(){
    const value=$('save-name').value.trim();
    if(!value||/[<>:"/\\|?*\u0000-\u001F]/.test(value))throw new Error('请填写有效的文件名');
    return value.toLowerCase().endsWith(pendingFile.extension)?value:value+pendingFile.extension;
  }
  function shareableFile(data,name){
    try{if(typeof File!=='function'||typeof navigator.share!=='function'||typeof navigator.canShare!=='function')return null;const file=new File([data.text],name,{type:data.type});return navigator.canShare({files:[file]})?file:null;}catch{return null;}
  }
  function openFileSave(data){
    pendingFile=data;$('save-title').textContent=data.title;$('save-name').value=data.name;
    const canShare=!!shareableFile(data,data.name);
    $('share-file').classList.toggle('hidden',!canShare);
    $('save-description').textContent=canShare?'可选择系统保存方式，或下载到浏览器指定的位置':'保存位置由浏览器的下载设置决定';
    $('save-dialog').showModal();$('save-name').focus();$('save-name').select();
  }
  $('cancel-save').onclick=()=>$('save-dialog').close();
  $('save-dialog').onclose=()=>{const origin=pendingFile?.origin;pendingFile=null;if(origin)$(origin).focus();};
  $('save-download').onclick=()=>{
    if(!pendingFile||savingFile)return;
    try{download(pendingFile.text,saveFilename(),pendingFile.type);$('save-dialog').close();status('已请求下载，请在浏览器的下载列表中查看');}
    catch(error){$('save-description').textContent=error?.message||'无法下载文件，请重试';}
  };
  $('share-file').onclick=async()=>{
    if(!pendingFile||savingFile)return;
    let file;try{file=shareableFile(pendingFile,saveFilename());}catch(error){$('save-description').textContent=error.message;return;}
    if(!file){$('save-description').textContent='当前浏览器无法打开系统保存菜单，请选择下载文件';return;}
    savingFile=true;$('share-file').disabled=true;$('save-download').disabled=true;buttons();
    try{await navigator.share({files:[file]});$('save-dialog').close();status('已交给系统处理，请确认文件已保存');}
    catch(error){if(error?.name!=='AbortError')$('save-description').textContent='无法打开系统保存菜单，请选择下载文件';}
    finally{savingFile=false;$('share-file').disabled=false;$('save-download').disabled=false;buttons();}
  };
  async function saveFile(data){
    if(typeof window.showSaveFilePicker!=='function'){openFileSave(data);return;}
    savingFile=true;buttons();let stream,selected=false;
    try{
      // Open directly from the click so the browser retains user activation.
      const handle=await window.showSaveFilePicker({id:data.pickerId,suggestedName:data.name,types:[{description:data.description,accept:{[data.type]:[data.extension]}}]});
      selected=true;stream=await handle.createWritable();
      await stream.write(new Blob([data.text],{type:data.type+';charset=utf-8'}));await stream.close();stream=null;
      status(data.saved,'success');
    }catch(error){
      if(stream){try{await stream.abort();}catch{}}
      if(error?.name==='AbortError'&&!selected)return;
      if(!selected&&['SecurityError','NotSupportedError'].includes(error?.name)){openFileSave(data);return;}
      status('无法保存'+(data.extension==='.itbook'?'密码本':'文本')+'，请重新选择位置或检查写入权限','error');
    }finally{savingFile=false;buttons();}
  }
  $('download-text').onclick=()=>{
    const text=$('output').value;if(!text||busy||savingFile)return;
    const name=lastAction==='encode'?'加密内容.txt':'解密文字.txt';
    return saveFile({text,name,type:'text/plain',extension:'.txt',description:'文本文件',title:'保存文本',saved:'文本已保存',origin:'download-text',pickerId:'information-translator-text'});
  };
  async function load(){
    let raw;
    try{raw=localStorage.getItem(STORAGE_KEY);}
    catch{$('book-storage').textContent='无法记住密码本，请导出备份';$('book-storage').classList.add('warning');return;}
    if(!raw)return;
    await task('正在载入本机保存的密码本',async()=>{
      let saved;try{if(raw.length>2*1024*1024)throw new Error();saved=JSON.parse(raw);if(saved?.v!==1||!Array.isArray(saved.files)||saved.files.length>200)throw new Error();}
      catch{throw new Error('本机密码本记录无法读取，请导入之前导出的 .itbook 文件');}
      let skipped=0;
      for(const fileText of saved.files){try{const file=await API.Book.readFile(fileText);if(!records.some(item=>item.id===file.id))records.push({id:file.id,name:file.name,seed:file.seed,raw:JSON.stringify(file,null,2)});}catch{skipped++;}}
      if(!records.length)throw new Error('本机没有可用的密码本，请重新导入文件');
      activeId='';dropCache();$('book-storage').textContent='已记住 '+records.length+' 本密码本';
      status(skipped?'部分记录无法读取，请重新导入':'');
    });
  }
  window.addEventListener('pagehide',dropCache);
  renderBooks();
  if(!API.supported()){$('compat').classList.remove('hidden');for(const id of ['new-book','import-book','encode','decode'])$(id).disabled=true;}
  else load();
})();
</script>
</body></html>
