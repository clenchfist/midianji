<main class="app">
<header class="header"><div class="identity"><span class="app-icon" aria-hidden="true">⇄</span><h1>密电机 Lite</h1></div></header>
<noscript><p class="notice">请允许此文件运行 JavaScript，才能使用加密功能</p></noscript>
<p id="compat" class="notice hidden" role="alert">当前环境不支持此工具，请用新版 Safari、Edge、Chrome 或 Firefox 打开</p>
<section class="credentials" aria-labelledby="book-heading">
<div class="credential-heading"><span class="field-heading" id="book-heading">当前密码本</span><span class="storage-state" id="book-storage"></span></div>
<div class="book-row"><div class="book-picker" id="book-picker">
<button class="book-select" id="book-select" type="button" aria-labelledby="book-heading book-selected-name" aria-expanded="false" aria-controls="book-list" disabled><span id="book-selected-name">尚未选择密码本</span><span class="book-caret" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
<div class="book-list hidden" id="book-list" role="group" aria-label="密码本列表"></div></div>
<div class="book-actions"><button class="button" id="new-book" type="button">生成新密码本</button><button class="button" id="import-book" type="button">导入密码本</button><button class="button" id="export-book" type="button" disabled>导出密码本</button><button class="button" id="rename-book" type="button" disabled>重命名</button></div></div>
<input type="file" id="book-file" class="hidden" aria-label="选择密码本文件">
<div class="rename-row hidden" id="rename-row"><label for="book-name">密码本名称</label><input id="book-name" maxlength="80" autocomplete="off"><button class="button" id="rename-confirm" type="button">保存</button><button class="button neutral" id="cancel-name" type="button">取消</button></div>
</section>
<div class="editor-grid">
<section class="panel" aria-labelledby="input-label"><div class="panel-heading"><label for="input" id="input-label">待处理内容</label><span class="count" id="input-count">0 字符</span></div>
<textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="待处理内容"></textarea>
<div class="panel-actions"><button class="button primary" id="encode" type="button">信息加密</button><button class="button decode-action" id="decode" type="button">密文翻译</button><button class="button neutral" id="clear-text" type="button">清空内容</button></div></section>
<section class="panel result-panel" aria-labelledby="output-label"><div class="panel-heading"><label for="output" id="output-label">处理结果</label><span class="result-type" id="result-type"></span></div>
<textarea id="output" readonly spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="处理结果"></textarea>
<div class="panel-actions"><button class="button" id="copy" type="button" disabled>复制结果</button><button class="button soft-green" id="download-text" type="button" disabled>下载文本</button><button class="button neutral" id="reverse" type="button" disabled>反向处理</button></div></section>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<details class="help" id="help"><summary>使用说明</summary><div class="help-body">
    <p>请单独妥善保管密码本，不要与密文一同公开，任何持有同一份密码本的人都可以加密和解密</p>
    <p>支持简繁体、生僻字、简单图形符号，单条原文最多 20,000 字符，一个普通汉字、英文字母、数字、标点或空格＝1字符</p>
  </div></details>
<footer>离线运行<span>内容只在本机处理</span><span>娱乐用途</span></footer>
</main>
<div class="copy-toast hidden" id="copy-toast" role="status" aria-live="polite">已复制</div>
<dialog id="save-dialog" aria-labelledby="save-title" aria-describedby="save-description"><h2 id="save-title">保存文本</h2><p id="save-description"></p><label class="save-label" for="save-name">文件名</label><input class="save-name" id="save-name" maxlength="120" autocomplete="off"><div class="dialog-actions"><button class="button neutral" id="cancel-save" type="button">取消</button><button class="button hidden" id="share-file" type="button">选择保存方式</button><button class="button primary" id="save-download" type="button">下载文件</button></div></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">删除记录</h2><p id="delete-description"></p><div class="dialog-actions"><button class="button" id="cancel-delete" type="button">取消</button><button class="button danger" id="confirm-delete" type="button">删除</button></div></dialog>

          for(let i=0;i<count;i++){
            while(bits<21){value=(value<<8)|data[p++];bits+=8;}bits-=21;
            out.push(this.character(((value>>>bits)&0x1FFFFF)|(this.mask&0xE00000)));value&=(1<<bits)-1;
          }
          return out.join('');
        }
        if(data.length<64||data.length%64!==0)fail('密文格式不正确');
        const count=new DataView(data.buffer,data.byteOffset,data.byteLength).getUint32(0,false);
        if(!count||count>MAX_CHARS||Math.ceil((4+3*count)/64)*64!==data.length)fail('密文长度不正确');
        const out=[];for(let i=0,p=4;i<count;i++,p+=3)out.push(this.character((data[p]<<16)|(data[p+1]<<8)|data[p+2]));return out.join('');
      }finally{data.fill(0);}
    }
    async decodeShort(packet){
      if(!await validPacket(packet,4))fail('内容不完整或已被改动，请重新复制完整内容');
      const nonce=packet.subarray(0,12);
      if(!equal(await shortBookCheck(this.seed,nonce),packet.subarray(13,17)))fail('密码本错误');
      const key=await messageKey(this.seed,nonce,4),aad=concat(enc.encode('INFO-TRANSLATOR/BOOK/4/CONTENT/'),packet.subarray(0,17));let data;
      try{data=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce,additionalData:aad,tagLength:128},key,packet.subarray(17,-2)));}
      catch{fail('内容不完整或已被改动，请重新复制完整内容');}
      try{
        if(data.length<2)fail('密文格式不正确');let text;
        if(data[0]===0){try{text=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(data.subarray(1));}catch{fail('密文中有无效文字');}}
        else if(data[0]===1){if((data.length-1)%2)fail('密文格式不正确');const out=[];for(let i=1;i<data.length;i+=2)out.push(String.fromCharCode((data[i]<<8)|data[i+1]));text=out.join('');}
        else if(data[0]===2){
          const count=Math.floor((data.length-1)*8/21);if(!count||count>MAX_CHARS||Math.ceil(count*21/8)!==data.length-1)fail('密文长度不正确');
          const out=[];let p=1,value=0,bits=0;
          for(let i=0;i<count;i++){while(bits<21){value=(value<<8)|data[p++];bits+=8;}bits-=21;out.push(this.character(((value>>>bits)&0x1FFFFF)|(this.mask&0xE00000)));value&=(1<<bits)-1;}
          if(value)fail('密文格式不正确');text=out.join('');
        }else fail('密文格式不正确');
        characters(text);return text;
      }finally{data.fill(0);}
    }
    destroy(){this.seed.fill(0);this.forward.fill(0);this.inverse.fill(0);this.destroyed=true;}
  }
  return {Book,COUNT,MAX_CHARS,supported,inspect,isMessage};
})();
</script><script id="translator-app">'use strict';
(()=>{
  const $=id=>document.getElementById(id),API=InformationTranslator,STORAGE_KEY='information-translator.books2';
  let records=[],activeId='',cached=null,busy=false,lastAction='encode',pendingDeleteId='',copyToastTimer=0,savingFile=false,pendingFile=null;
  const active=()=>records.find(record=>record.id===activeId);
  function status(text,type=''){$('status').textContent=text;$('status').className='status '+type;}
  function copied(){clearTimeout(copyToastTimer);$('copy-toast').classList.remove('hidden');copyToastTimer=setTimeout(()=>$('copy-toast').classList.add('hidden'),1000);}
  function dropCache(){cached?.destroy();cached=null;}
  function buttons(){
    for(const id of ['new-book','import-book'])$(id).disabled=busy||!API.supported();
    $('book-select').disabled=busy||!records.length;
    for(const id of ['export-book','rename-book'])$(id).disabled=busy||!active()||(id==='export-book'&&savingFile);
    for(const button of $('book-list').querySelectorAll('button'))button.disabled=busy;
    for(const id of ['copy','download-text','reverse'])$(id).disabled=busy||!$('output').value||(id==='download-text'&&savingFile);
  }
  function clearResult(){$('output').value='';$('result-type').textContent='';buttons();}
  function count(){$('input-count').textContent=[...$('input').value].length.toLocaleString()+' 字符';}
  function closeBookMenu(focus=false){$('book-list').classList.add('hidden');$('book-select').setAttribute('aria-expanded','false');if(focus)$('book-select').focus();}
  function openBookMenu(focus=false,last=false){
    if(busy||!records.length)return;$('book-list').classList.remove('hidden');$('book-select').setAttribute('aria-expanded','true');
    if(focus){const choices=Array.from($('book-list').querySelectorAll('.book-choice')),current=choices.find(button=>button.dataset.bookId===activeId);(last?choices[choices.length-1]:current||choices[0])?.focus();}
  }
  async function chooseBook(id){
    if(busy)return;closeBookMenu();clearResult();
    await task('正在切换密码本',async()=>{await selectBook(id);status('已选用「'+active().name+'」','success');});
    $('book-select').focus();
  }
  function renderBooks(){
    const list=$('book-list');list.replaceChildren();
    $('book-selected-name').textContent=active()?.name||(records.length?'请选择密码本':'尚未选择密码本');$('book-select').dataset.bookId=activeId;
    for(const record of records){
      const row=document.createElement('div'),choice=document.createElement('button'),remove=document.createElement('button');
      row.className='book-item'+(record.id===activeId?' is-current':'');row.dataset.bookId=record.id;
      choice.type='button';choice.className='book-choice';choice.textContent=record.name;choice.title=record.name;choice.dataset.bookId=record.id;choice.setAttribute('aria-pressed',String(record.id===activeId));choice.onclick=()=>chooseBook(record.id);
      remove.type='button';remove.className='book-remove';remove.textContent='删除';remove.dataset.bookId=record.id;remove.setAttribute('aria-label','删除「'+record.name+'」');remove.onclick=()=>requestDelete(record.id);
      row.append(choice,remove);list.append(row);
    }
    if(!records.length)closeBookMenu();
    const name=$('book-selected-name').textContent;$('book-select').title=name;
    $('book-picker').style.width=Math.min(900,Math.max(280,[...name].length*15+52))+'px';
    buttons();
  }
  function persist(nextRecords=records){
    try{
      if(nextRecords.length)localStorage.setItem(STORAGE_KEY,JSON.stringify({v:1,files:nextRecords.map(record=>record.raw)}));
      else localStorage.removeItem(STORAGE_KEY);
      $('book-storage').textContent=nextRecords.length?'已记住 '+nextRecords.length+' 本密码本':'';$('book-storage').classList.remove('warning');return true;
    }catch{$('book-storage').textContent='无法记住密码本，请导出备份';$('book-storage').classList.add('warning');return false;}
  }
  async function task(text,action){
    if(busy)return;closeBookMenu();busy=true;const states=new Map();
    for(const el of document.querySelectorAll('button,input,textarea,select')){states.set(el,el.disabled);el.disabled=true;}
    status(text);
    try{await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));await action();}
    catch(error){status(error?.message||'操作未完成，请重试','error');}
    finally{busy=false;for(const [el,value]of states)el.disabled=value;renderBooks();}
  }
  async function selectBook(id,save=true){
    const record=records.find(item=>item.id===id);if(!record)throw new Error('请先生成或导入密码本');
    if(cached?.id!==id){const next=await API.Book.restore(record.raw);dropCache();cached=next;}
    activeId=id;$('rename-row').classList.add('hidden');if(save)persist();return cached;
  }
  function download(text,name,type='text/plain;charset=utf-8'){
    const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
  function readBookFile(file){
    if(typeof file.text==='function')return file.text();
    return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('无法读取密码本文件，请重新选择'));reader.onabort=()=>reject(new Error('读取已取消'));reader.readAsText(file,'utf-8');});
  }
  $('new-book').onclick=()=>task('正在生成新密码本',async()=>{
    if(records.length>=200)throw new Error('当前浏览器已保存较多密码本，请换一个浏览器保存新的密码本');
    const book=await API.Book.create();let number=1;while(records.some(record=>record.name==='密码本 '+number))number++;
    const name='密码本 '+number,raw=await book.export(name),file=await API.Book.readFile(raw);
    records.push({id:file.id,name:file.name,seed:file.seed,raw});dropCache();cached=book;activeId=file.id;
    $('rename-row').classList.add('hidden');clearResult();persist();
    status('密码本已生成','success');
  });
  $('book-select').onclick=()=>{$('book-list').classList.contains('hidden')?openBookMenu():closeBookMenu();};
  $('book-select').onkeydown=event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();openBookMenu(true,event.key==='ArrowUp');}else if(event.key==='Escape'){event.preventDefault();closeBookMenu(true);}};
  $('book-list').onkeydown=event=>{
    if(event.key==='Escape'){event.preventDefault();closeBookMenu(true);return;}
    if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;
    const choices=Array.from($('book-list').querySelectorAll('.book-choice'));if(!choices.length)return;event.preventDefault();
    const index=choices.findIndex(button=>button.dataset.bookId===event.target.dataset.bookId);
    const next=event.key==='Home'?0:event.key==='End'?choices.length-1:(index+(event.key==='ArrowDown'?1:-1)+choices.length)%choices.length;choices[next].focus();
  };
  document.addEventListener('click',event=>{if(!$('book-picker').contains(event.target))closeBookMenu();});
  $('book-picker').addEventListener('focusout',event=>{if(event.relatedTarget&&!$('book-picker').contains(event.relatedTarget))closeBookMenu();});
  $('import-book').onclick=()=>$('book-file').click();
  $('book-file').onchange=()=>{
    const file=$('book-file').files?.[0];$('book-file').value='';if(!file)return;
    return task('正在导入密码本',async()=>{
      if(file.size>8192)throw new Error('所选文件不是有效的密码本，请选择导出的 .itbook 文件');
      const parsed=await API.Book.readFile(await readBookFile(file)),existing=records.find(item=>item.id===parsed.id);
      if(existing&&existing.seed!==parsed.seed)throw new Error('密码本编号发生冲突，请核对文件');
      if(!existing){if(records.length>=200)throw new Error('当前浏览器已保存较多密码本，请换一个浏览器导入');records.push({id:parsed.id,name:parsed.name,seed:parsed.seed,raw:JSON.stringify(parsed,null,2)});}
      await selectBook(parsed.id);clearResult();status('已载入「'+active().name+'」，可以直接加密和解密','success');
    });
  };
  $('export-book').onclick=()=>{
    const record=active();if(!record||busy||savingFile)return;
    const filename=record.name.replace(/[<>:"/\\|?*\u0000-\u001F]/g,'_')+'.itbook';
    return saveFile({text:record.raw,name:filename,type:'application/json',extension:'.itbook',description:'密码本文件',title:'导出密码本',saved:'密码本已保存',origin:'export-book',pickerId:'midianji-codebook'});
  };
  $('rename-book').onclick=()=>{if(!active())return;$('book-name').value=active().name;$('rename-row').classList.remove('hidden');$('book-name').focus();$('book-name').select();};
  $('cancel-name').onclick=()=>$('rename-row').classList.add('hidden');
  $('book-name').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();$('rename-confirm').click();}if(event.key==='Escape')$('rename-row').classList.add('hidden');};
  $('rename-confirm').onclick=()=>task('正在保存名称',async()=>{
    const record=active();if(!record)throw new Error('请先选择密码本');
    const raw=await API.Book.renameFile(record.raw,$('book-name').value),file=await API.Book.readFile(raw);record.name=file.name;record.raw=raw;
    $('rename-row').classList.add('hidden');persist();status('已重命名为「'+file.name+'」','success');
  });
  function requestDelete(id){
    const record=records.find(item=>item.id===id);if(busy||!record)return;closeBookMenu();
    pendingDeleteId=record.id;
    $('delete-description').textContent='删除「'+record.name+'」的本机记录？已导出的文件不会删除，如果没有文件备份，删除后将无法恢复这本密码本';
    $('delete-dialog').showModal();$('cancel-delete').focus();
  }
  $('cancel-delete').onclick=()=>$('delete-dialog').close();
  $('delete-dialog').onclose=()=>{pendingDeleteId='';$('book-select').focus();};
  $('confirm-delete').onclick=()=>{
    const record=records.find(item=>item.id===pendingDeleteId);if(!record){$('delete-dialog').close();return;}
    const nextRecords=records.filter(item=>item.id!==record.id);
    if(!persist(nextRecords)){$('delete-dialog').close();status('无法删除本机记录：浏览器不允许保存更改，请稍后再试','error');return;}
    records=nextRecords;
    if(activeId===record.id){dropCache();activeId='';$('rename-row').classList.add('hidden');clearResult();}
    $('delete-dialog').close();renderBooks();status('已删除「'+record.name+'」的本机记录，需要时可重新导入已导出的文件','success');
  };
  function run(action){
    if(busy)return;clearResult();
    return task(action==='encode'?'正在加密':'正在解密',async()=>{
      const input=$('input').value;if(!input)throw new Error('请先输入要处理的内容');
      if(!active())throw new Error('请先导入或手动选择密码本');
      const engine=await selectBook(activeId);
      if(action==='encode'&&await API.isMessage(input,engine))throw new Error('这段内容已经加密过了，要查看原文，请点击“密文翻译”');
      $('output').value=action==='encode'?await engine.encode(input):await engine.decode(input);lastAction=action;
      $('result-type').textContent=action==='encode'?'密文':'原文';
      status(action==='encode'?'加密完成':'解密完成','success');
    });
  }
  $('encode').onclick=()=>run('encode');$('decode').onclick=()=>run('decode');
  $('input').oninput=()=>{count();clearResult();status('');};
  $('input').onkeydown=async event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();run(await API.isMessage($('input').value,cached)?'decode':'encode');}};
  $('clear-text').onclick=()=>{$('input').value='';clearResult();count();status('内容已清空');};
  $('reverse').onclick=()=>{if(!$('output').value||busy)return;$('input').value=$('output').value;count();run(lastAction==='encode'?'decode':'encode');};
  $('copy').onclick=async()=>{
    if(!$('output').value)return;
    try{if(!navigator.clipboard?.writeText)throw new Error();await navigator.clipboard.writeText($('output').value);copied();}
    catch{
      $('output').focus();$('output').select();
      if(typeof $('output').setSelectionRange==='function')$('output').setSelectionRange(0,$('output').value.length);
      let success=false;
      try{success=document.execCommand('copy');}catch{}
      if(success)copied();else status('结果已选中，请使用系统复制');
    }
  };
  function saveFilename(){
    const value=$('save-name').value.trim();
    if(!value||/[<>:"/\\|?*\u0000-\u001F]/.test(value))throw new Error('请填写有效的文件名');
    return value.toLowerCase().endsWith(pendingFile.extension)?value:value+pendingFile.extension;
  }
  function shareableFile(data,name){
    try{if(typeof File!=='function'||typeof navigator.share!=='function'||typeof navigator.canShare!=='function')return null;const file=new File([data.text],name,{type:data.type});return navigator.canShare({files:[file]})?file:null;}catch{return null;}
  }
  function openFileSave(data){
    pendingFile=data;$('save-title').textContent=data.title;$('save-name').value=data.name;
    const canShare=!!shareableFile(data,data.name);
    $('share-file').classList.toggle('hidden',!canShare);
    $('save-description').textContent=canShare?'可选择系统保存方式，或下载到浏览器指定的位置':'保存位置由浏览器的下载设置决定';
    $('save-dialog').showModal();$('save-name').focus();$('save-name').select();
  }
  $('cancel-save').onclick=()=>$('save-dialog').close();
  $('save-dialog').onclose=()=>{const origin=pendingFile?.origin;pendingFile=null;if(origin)$(origin).focus();};
  $('save-download').onclick=()=>{
    if(!pendingFile||savingFile)return;
    try{download(pendingFile.text,saveFilename(),pendingFile.type);$('save-dialog').close();status('已请求下载，请在浏览器的下载列表中查看');}
    catch(error){$('save-description').textContent=error?.message||'无法下载文件，请重试';}
  };
  $('share-file').onclick=async()=>{
    if(!pendingFile||savingFile)return;
    let file;try{file=shareableFile(pendingFile,saveFilename());}catch(error){$('save-description').textContent=error.message;return;}
    if(!file){$('save-description').textContent='当前浏览器无法打开系统保存菜单，请选择下载文件';return;}
    savingFile=true;$('share-file').disabled=true;$('save-download').disabled=true;buttons();
    try{await navigator.share({files:[file]});$('save-dialog').close();status('已交给系统处理，请确认文件已保存');}
    catch(error){if(error?.name!=='AbortError')$('save-description').textContent='无法打开系统保存菜单，请选择下载文件';}
    finally{savingFile=false;$('share-file').disabled=false;$('save-download').disabled=false;buttons();}
  };
  async function saveFile(data){
    if(typeof window.showSaveFilePicker!=='function'){openFileSave(data);return;}
    savingFile=true;buttons();let stream,selected=false;
    try{
      // Open directly from the click so the browser retains user activation.
      const handle=await window.showSaveFilePicker({id:data.pickerId,suggestedName:data.name,types:[{description:data.description,accept:{[data.type]:[data.extension]}}]});
      selected=true;stream=await handle.createWritable();
      await stream.write(new Blob([data.text],{type:data.type+';charset=utf-8'}));await stream.close();stream=null;
      status(data.saved,'success');
    }catch(error){
      if(stream){try{await stream.abort();}catch{}}
      if(error?.name==='AbortError'&&!selected)return;
      if(!selected&&['SecurityError','NotSupportedError'].includes(error?.name)){openFileSave(data);return;}
      status('无法保存'+(data.extension==='.itbook'?'密码本':'文本')+'，请重新选择位置或检查写入权限','error');
    }finally{savingFile=false;buttons();}
  }
  $('download-text').onclick=()=>{
    const text=$('output').value;if(!text||busy||savingFile)return;
    const name=lastAction==='encode'?'加密内容.txt':'解密文字.txt';
    return saveFile({text,name,type:'text/plain',extension:'.txt',description:'文本文件',title:'保存文本',saved:'文本已保存',origin:'download-text',pickerId:'information-translator-text'});
  };
  async function load(){
    let raw;
    try{raw=localStorage.getItem(STORAGE_KEY);}
    catch{$('book-storage').textContent='无法记住密码本，请导出备份';$('book-storage').classList.add('warning');return;}
    if(!raw)return;
    await task('正在载入本机保存的密码本',async()=>{
      let saved;try{if(raw.length>2*1024*1024)throw new Error();saved=JSON.parse(raw);if(saved?.v!==1||!Array.isArray(saved.files)||saved.files.length>200)throw new Error();}
      catch{throw new Error('本机密码本记录无法读取，请导入之前导出的 .itbook 文件');}
      let skipped=0;
      for(const fileText of saved.files){try{const file=await API.Book.readFile(fileText);if(!records.some(item=>item.id===file.id))records.push({id:file.id,name:file.name,seed:file.seed,raw:JSON.stringify(file,null,2)});}catch{skipped++;}}
      if(!records.length)throw new Error('本机没有可用的密码本，请重新导入文件');
      activeId='';dropCache();$('book-storage').textContent='已记住 '+records.length+' 本密码本';
      status(skipped?'部分记录无法读取，请重新导入':'');
    });
  }
  window.addEventListener('pagehide',dropCache);
  renderBooks();
  if(!API.supported()){$('compat').classList.remove('hidden');for(const id of ['new-book','import-book','encode','decode'])$(id).disabled=true;}
  else load();
})();
</script>
