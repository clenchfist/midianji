<script id="translator-core">'use strict';
const InformationTranslator=(()=>{
  const COUNT=0x110000-0x800,MAX_CHARS=20000;

  function equal(a,b){if(a.length!==b.length)return false;let difference=0;for(let i=0;i<a.length;i++)difference|=a[i]^b[i];return difference===0;}

    if(base64(bytes)!==text)fail('内容编码不正确，请重新复制');return bytes;
  }

    if(typeof name!=='string'||!name.trim()||[...name.trim()].length>40||/[\u0000-\u001F\u007F]/.test(name))fail('请填写 1–40 个字符的密码本名称');
    return name.trim();
  }

    if(typeof text!=='string'||!text.length)fail('请先输入要加密的内容');
    if(text.length>MAX_CHARS*2)fail('每条原文最多 20,000 个 Unicode 字符');

    const file={format:FORMAT,v:1,name:nameOf(name),id:await fingerprint(seed),seed:base64(seed)};

    if(typeof raw!=='string'||raw.length>8192)fail('密码本文件过大或格式不正确，请选择导出的 .itbook 文件');

      row.append(name,state,save,verify);$('legacy-list').append(row);
    }
    $('legacy-clear').disabled=!legacy.entries.length||legacy.entries.some(item=>!item.verified);buttons();
  }
  function saveLegacy(item){
    if(busy)return;
    if(!canChooseSave()){openFileSave({text:item.raw,name:item.file.name+'.itbook',type:'application/json',extension:'.itbook',title:'保存旧密码本',origin:'legacy-open'});return;}
    let choice;try{choice=window.showSaveFilePicker(pickerOptions(item.file.name+'.itbook'));}catch(error){status(error.message,'error');return;}
    return task('请选择旧密码本保存位置',async token=>{
      const handle=await choice,previous=await readHandle(handle);
      current(token);
      if(previous){let file;try{file=await API.Book.readFile(previous);}catch{throw new Error('请选择新文件，避免覆盖其他内容');}if(!sameBook(file,item.file))throw new Error('所选位置已存有其他密码本，请更换文件名');}
      await writeBook(handle,item.raw,previous,token);item.verified=true;renderLegacy();status('旧密码本已保存并核对','success');
    });
  }
  $('legacy-file').onchange=()=>{
    const file=$('legacy-file').files?.[0],item=legacy?.entries.find(entry=>entry.file.id===legacyVerifyId);$('legacy-file').value='';legacyVerifyId='';if(!file||!item)return;
    return task('正在核对密码本文件',async token=>{if(file.size>8192)throw new Error('所选文件不是正确的密码本');const parsed=await API.Book.readFile(await readText(file));current(token);if(!sameBook(parsed,item.file)||parsed.checksum!==item.file.checksum)throw new Error('所选文件与旧密码本不一致');item.verified=true;renderLegacy();status('旧密码本文件已核对','success');});
  };
  $('legacy-open').onclick=()=>{if(legacy){renderLegacy();$('legacy-dialog').showModal();}};
  $('legacy-later').onclick=()=>$('legacy-dialog').close();
  $('legacy-clear').onclick=()=>{
    if(busy||!legacy||legacy.entries.some(item=>!item.verified))return;
    try{if(localStorage.getItem(LEGACY_KEY)!==legacy.snapshot)throw new Error('旧记录已被其他页面修改，请刷新后重新核对');localStorage.removeItem(LEGACY_KEY);if(localStorage.getItem(LEGACY_KEY)!==null)throw new Error('旧记录未能清除，请保留密码本文件并重试');legacy=null;$('legacy-list').replaceChildren();$('legacy-dialog').close();buttons();status('旧记录已清除，新版不再自动保存密码本','success');}
    catch(error){$('legacy-description').textContent=error.message;status(error.message,'error');}
  };
  async function loadLegacy(){
    const token=epoch;
    let snapshot;try{snapshot=localStorage.getItem(LEGACY_KEY);}catch{return;}if(!snapshot)return;
    try{
      if(snapshot.length>2*1024*1024)throw new Error();const data=JSON.parse(snapshot);if(data?.v!==1||!Array.isArray(data.files)||data.files.length>200)throw new Error();
      const entries=[];for(const raw of data.files){const file=await API.Book.readFile(raw);current(token);if(entries.some(item=>item.file.id===file.id&&!sameBook(item.file,file)))throw new Error();if(!entries.some(item=>sameBook(item.file,file)))entries.push({raw,file,verified:false});}
      if(!entries.length)return;legacy={snapshot,entries};renderLegacy();$('legacy-dialog').showModal();
    }catch{if(token===epoch)status('旧浏览器记录无法读取，请先保留原数据并确认密码本文件备份','error');}
  }
  function resetRuntime(){
    epoch++;dropCache();for(const record of records){record.raw='';record.handle=null;record.file=null;}records=[];activeId='';legacy=null;pendingFile=null;busy=false;savingFile=false;pendingDelete='';legacyVerifyId='';
    clearTimeout(copyTimer);$('copy-toast').classList.add('hidden');$('input').value='';$('output').value='';$('result-type').textContent='';$('rename-row').classList.add('hidden');$('book-name').value='';$('legacy-list').replaceChildren();
    for(const id of ['save-dialog','delete-dialog','legacy-dialog'])if($(id).open)$(id).close();count();status('');renderBooks();
  }
  window.addEventListener('pagehide',resetRuntime);
  window.addEventListener('pageshow',event=>{if(event.persisted)loadLegacy();});
  renderBooks();count();
  if(!API.supported()){$('compat').classList.remove('hidden');for(const id of ['new-book','import-book','encode','decode'])$(id).disabled=true;}
  else loadLegacy();
})();
</script>
</body></html>
